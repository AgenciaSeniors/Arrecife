<script>
/* =========================================================================
   FICHAS DE COSTO · Modelo oficial MFP (Resolución 148/2023)
   Motor de cálculo replicado de la ficha modelo en Excel (FormatoOficial).
   Comprobado: con los datos de la bomba sumergible da exactamente 524 000.
   ========================================================================= */
const LS = "fichasDunax_v2";
const RATES_DEF = {
  ventas:10, local:1, fuerzaTrabajo:5, segSocial:12.5, segSocialCP:1.5,
  vacaciones:9.09, utilidades:35, reserva:10, margenServicio:15, margenProduccion:25
};
let DB = cargar();

function cargar(){
  const raw = localStorage.getItem(LS);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return semilla();
}
function guardar(){ localStorage.setItem(LS, JSON.stringify(DB)); }

function semilla(){
  return {
    empresa:{
      nombre:"DUNAX S.R.L.", nit:"5000 4414 217", sucursal:"326",
      direccion:"Calle 4ta Edif. G-01 Apto 3 e/ G y Aldabó, Altahabana, Boyeros, La Habana",
      cuenta:"0536245000761315", telefono:"(+53) 5697 8275",
      validez:15, garantia:6, formaPago:"Transferencia bancaria", anticipo:50
    },
    rates:{...RATES_DEF},
    catalogo:[
      {id:id(),nombre:"Bomba sumergible",um:"unidad",precio:206800},
      {id:id(),nombre:"Tubería",um:"metro",precio:11735.18},
      {id:id(),nombre:"Piezas de acople",um:"unidad",precio:9392.79},
      {id:id(),nombre:"Cable eléctrico",um:"metro",precio:3415.56},
      {id:id(),nombre:"Insumos gastables",um:"unidad",precio:474.385},
      {id:id(),nombre:"Calentador de agua 80L",um:"unidad",precio:309375},
      {id:id(),nombre:"Presurizador",um:"unidad",precio:140625},
      {id:id(),nombre:"Panel solar TOPCON 550W",um:"unidad",precio:0},
      {id:id(),nombre:"Inversor 3KW 110/220V",um:"unidad",precio:0}
    ],
    fichas:[ fichaBomba() ]
  };
}
// Ficha de ejemplo: instalación de bomba sumergible (Hospital Cira García).
// Reproduce exactamente la ficha de costo del MFP y la oferta = 524 000.
function fichaBomba(){
  return {
    id:id(), servicio:"Instalación de bomba sumergible", cliente:"Hospital Cira García",
    tipo:"servicio", um:"unidad", moneda:"CUP", fecha:hoy(),
    insumos:[
      {nombre:"Bomba sumergible",um:"unidad",precio:206800,cantidad:1},
      {nombre:"Tubería",um:"metro",precio:11735.18,cantidad:10},
      {nombre:"Piezas de acople",um:"unidad",precio:9392.79,cantidad:4},
      {nombre:"Cable eléctrico",um:"metro",precio:3415.56,cantidad:10},
      {nombre:"Insumos gastables",um:"unidad",precio:474.385,cantidad:2}
    ],
    combustibles:0, energia:0, agua:0,
    salarios:[
      {actividad:"Preparación del sitio y medidas de seguridad eléctrica",trabajadores:2,horas:4,salarioHora:125},
      {actividad:"Montaje de tubería de descarga y válvula check",trabajadores:2,horas:4,salarioHora:125},
      {actividad:"Conexión de cable de uso rudo e interruptor de flotador",trabajadores:2,horas:2,salarioHora:200},
      {actividad:"Descenso y posicionamiento de la bomba",trabajadores:2,horas:5,salarioHora:125},
      {actividad:"Conexión de tubería a la red de distribución",trabajadores:1,horas:1,salarioHora:125},
      {actividad:"Pruebas de funcionamiento y ajuste de flotador",trabajadores:2,horas:2,salarioHora:200},
      {actividad:"Conexión eléctrica al tablero con termomagnético",trabajadores:2,horas:2,salarioHora:200}
    ],
    otrosDirectos:0,
    transporte:14231.5, amortizacion:2500,
    generales:1210, distribucion:0, financieros:130, osde:0,
    modoPrecio:'fijo', precioObjetivo:524000, margen:10, precioAjustado:524000,
    notas:"", validez:15, garantia:6, formaPago:"Transferencia bancaria", anticipo:50
  };
}
function id(){ return Math.random().toString(36).slice(2,10); }
function hoy(){ return new Date().toISOString().slice(0,10); }

/* ========================= CÁLCULO (modelo oficial MFP) =========================
   Filas del modelo:
     1  Gasto Material        = Σ insumos + combustibles + energía + agua
     2  Salario Directo       = salario base + vacaciones
     3  Otros gastos directos
     4  Gastos asociados a la producción = transporte + amortización
     5  COSTO TOTAL           = 1 + 2 + 3 + 4
     6  Gastos Generales y de Administración
     7  Gastos de Distribución y Ventas
     8  Gastos Financieros
     9  Gastos por Financiamiento a la OSDE
     10 Gastos Tributarios    = tributos s/ salario + impuesto s/ ventas + aporte desarrollo local
     11 TOTAL DE GASTOS       = 6 + 7 + 8 + 9 + 10
     12 TOTAL COSTOS Y GASTOS = 5 + 11
     13 Utilidad              = Precio − 12
     14 PRECIO O TARIFA
     15 PRECIO AJUSTADO

   Tributos sobre el salario = Devengado × (Fuerza de Trabajo + Seg. Social + Corto Plazo)
   Impuesto s/ ventas        = Precio × tasa ventas
   Aporte desarrollo local   = Precio × tasa local

   El precio se obtiene de dos maneras:
     · modo "fijo":   se fija el precio y se deduce el margen real.
     · modo "margen": Precio = costoEstimado·(1+m) / (1 − (ventas+local)·(1+m))
       donde costoEstimado = 5 + 6 + 7 + 8 + 9 + tributos s/ salario
       y m = margen como % sobre el costo total (fila 12).
================================================================================ */
function calc(f){
  const r = DB.rates, pct = x => (x||0)/100;
  const tribSalRate = pct(r.fuerzaTrabajo)+pct(r.segSocial)+pct(r.segSocialCP);
  const tasaVL = pct(r.ventas)+pct(r.local);

  // Fila 1 · Gasto material
  const subtotalInsumos = (f.insumos||[]).reduce((s,i)=>s+(i.precio||0)*(i.cantidad||0),0);
  const fila1 = subtotalInsumos + (f.combustibles||0)+(f.energia||0)+(f.agua||0);

  // Fila 2 · Salario directo (importe = horas × $/hora; los trabajadores son informativos)
  const salarioBase = (f.salarios||[]).reduce((s,a)=>s+(a.horas||0)*(a.salarioHora||0),0);
  const vacaciones  = salarioBase*pct(r.vacaciones);
  const devengado   = salarioBase+vacaciones;
  const fila2 = devengado;

  const fila3 = f.otrosDirectos||0;                       // Otros gastos directos
  const fila4 = (f.transporte||0)+(f.amortizacion||0);    // Gastos asociados a la producción
  const fila5 = fila1+fila2+fila3+fila4;                  // COSTO TOTAL

  const tribSalario = devengado*tribSalRate;              // tributos sobre el salario
  const fila6 = f.generales||0, fila7 = f.distribucion||0, fila8 = f.financieros||0, fila9 = f.osde||0;
  const costoEstimado = fila5+fila6+fila7+fila8+fila9+tribSalario;

  // Precio
  let precio;
  if(f.modoPrecio==='fijo' && (f.precioObjetivo||0)>0){
    precio = f.precioObjetivo;
  } else {
    const m = pct(f.margen);
    const denom = 1 - tasaVL*(1+m);
    precio = denom>0 ? costoEstimado*(1+m)/denom : 0;
  }

  const impVentas  = precio*pct(r.ventas);
  const aporteLocal= precio*pct(r.local);
  const fila10 = tribSalario+impVentas+aporteLocal;       // Gastos Tributarios
  const fila11 = fila6+fila7+fila8+fila9+fila10;          // TOTAL DE GASTOS
  const fila12 = fila5+fila11;                            // TOTAL COSTOS Y GASTOS
  const utilidad = precio-fila12;                         // Fila 13
  const fila14 = precio;                                  // PRECIO O TARIFA
  const margenReal = fila12>0 ? utilidad/fila12*100 : 0;  // % de utilidad sobre el costo
  const ajustado = f.precioAjustado>0 ? f.precioAjustado : Math.round(precio);

  // Análisis de la utilidad
  const reserva   = utilidad*pct(r.reserva);
  const utilAntes = utilidad-reserva;
  const impUtil   = utilAntes*pct(r.utilidades);
  const utilNeta  = utilAntes-impUtil;

  return {subtotalInsumos,salarioBase,vacaciones,devengado,tribSalario,impVentas,aporteLocal,costoEstimado,
    fila1,fila2,fila3,fila4,fila5,fila6,fila7,fila8,fila9,fila10,fila11,fila12,
    utilidad,fila14,margenReal,ajustado,reserva,utilAntes,impUtil,utilNeta};
}
function fmt(n,mon){ const s=(n||0).toLocaleString('es-CU',{minimumFractionDigits:2,maximumFractionDigits:2}); return (mon? (mon==='USD'?'USD ':'$ ')+s : s); }

/* ========================= ROUTER ========================= */
let vista="fichas", edId=null;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{vista=b.dataset.vista;edId=null;render();});
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('activo',b.dataset.vista===vista));
  document.getElementById('hdrEmpresa').textContent = DB.empresa.nombre||"Empresa";
  const app=document.getElementById('app');
  if(vista==='fichas')   app.innerHTML = edId? vEditor():vFichas();
  if(vista==='catalogo') app.innerHTML = vCatalogo();
  if(vista==='empresa')  app.innerHTML = vEmpresa();
  if(vista==='respaldo') app.innerHTML = vRespaldo();
  if(edId) bindEditor();
}

/* ========================= VISTA: LISTA FICHAS ========================= */
function vFichas(){
  const items = DB.fichas.map(f=>{
    const c=calc(f);
    return `<div class="ficha-item" onclick="abrir('${f.id}')">
      <div class="serv">${esc(f.servicio||'(sin nombre)')}</div>
      <div class="cli">${esc(f.cliente||'Sin cliente')} · <span class="pill">${f.tipo==='produccion'?'Producción':'Servicio'}</span></div>
      <div class="precio">${fmt(c.ajustado,f.moneda)}<small> ${f.moneda}</small></div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="top-acciones">
      <div><h2>Mis Fichas de Costo</h2><div class="sub">Cada ficha calcula el costo real, los impuestos y el precio según el modelo del MFP.</div></div>
      <button class="btn acento" onclick="nueva()">+ Nueva ficha</button>
    </div>
    ${DB.fichas.length? `<div class="lista-ficha">${items}</div>` : `<div class="vacio">Aún no tienes fichas. Crea la primera con “Nueva ficha”.</div>`}
  </div>`;
}
function nueva(){
  const f={id:id(),servicio:"",cliente:"",tipo:"servicio",um:"unidad",moneda:"CUP",fecha:hoy(),
    insumos:[],combustibles:0,energia:0,agua:0,salarios:[],otrosDirectos:0,
    transporte:0,amortizacion:0,generales:0,distribucion:0,financieros:0,osde:0,
    modoPrecio:'margen',precioObjetivo:0,margen:DB.rates.margenServicio,precioAjustado:0,
    notas:"",validez:DB.empresa.validez,garantia:DB.empresa.garantia,formaPago:DB.empresa.formaPago,anticipo:DB.empresa.anticipo};
  DB.fichas.unshift(f); guardar(); edId=f.id; render();
}
function abrir(i){ edId=i; render(); }

/* ========================= VISTA: EDITOR ========================= */
function f(){ return DB.fichas.find(x=>x.id===edId); }
function vEditor(){
  const x=f();
  return `<div class="top-acciones">
    <button class="btn gris sm" onclick="edId=null;render()">← Volver</button>
    <span class="pill">${x.tipo==='produccion'?'Producción · margen máx 25%':'Servicio · margen máx 15%'}</span>
    <button class="btn ok" onclick="imprimirFicha()">Ver ficha de costo (MFP)</button>
    <button class="btn acento" onclick="imprimirOferta()">Generar oferta</button>
  </div>
  <div class="editor-grid">
    <div>
      <div class="card">
        <h2>Datos del trabajo</h2>
        <div class="grid g2" style="margin-top:10px">
          <div><label>Servicio / producto</label><input id="servicio" value="${esc(x.servicio)}"></div>
          <div><label>Cliente</label><input id="cliente" value="${esc(x.cliente)}"></div>
          <div><label>Tipo (define el margen legal)</label>
            <select id="tipo"><option value="servicio"${x.tipo==='servicio'?' selected':''}>Servicio (máx 15%)</option><option value="produccion"${x.tipo==='produccion'?' selected':''}>Producción de bienes (máx 25%)</option></select></div>
          <div><label>Moneda</label><select id="moneda"><option ${x.moneda==='CUP'?'selected':''}>CUP</option><option ${x.moneda==='USD'?'selected':''}>USD</option></select></div>
          <div><label>Unidad de medida</label><input id="um" value="${esc(x.um||'unidad')}"></div>
          <div><label>Fecha</label><input type="date" id="fecha" value="${esc(x.fecha||hoy())}"></div>
        </div>
      </div>

      <div class="card">
        <h3>1 · Materiales e insumos</h3>
        <div class="mini">Agrega lo que se instala y se gasta. Puedes elegir del catálogo o escribirlo.</div>
        <table><thead><tr><th style="width:42%">Material</th><th>U/M</th><th class="num">Precio</th><th class="num">Cantidad</th><th class="num">Importe</th><th></th></tr></thead>
        <tbody id="tInsumos">${filasInsumos(x)}</tbody></table>
        <div class="fila-btns"><button class="btn gris sm" onclick="addInsumo()">+ Agregar material</button>

          <div><label>Transporte</label><input type="number" id="transporte" value="${x.transporte||0}"><div class="mini">Fila 4 · asociado a esta obra</div></div>
          <div><label>Amortización de equipos</label><input type="number" id="amortizacion" value="${x.amortizacion||0}"><div class="mini">Fila 4 · activos fijos usados</div></div>
        </div>
      </div>

      <div class="card">
        <h3>4 · Gastos indirectos del negocio</h3>
        <div class="mini">Estimado de cada partida que corresponde a este trabajo. Los impuestos (s/ ventas, desarrollo local y los tributos del salario) se calculan solos.</div>
        <div class="grid g4" style="margin-top:8px">
          <div><label>Generales y administración</label><input type="number" id="generales" value="${x.generales||0}"><div class="mini">Fila 6</div></div>

      <div class="card">
        <h3>5 · Ganancia y oferta</h3>
        <div class="grid g2" style="margin-top:6px">

          ${x.modoPrecio==='fijo'
            ? `<div><label>Precio que quiero cobrar</label><input type="number" id="precioObjetivo" value="${x.precioObjetivo||0}"><div class="mini" id="avMargen"></div></div>`
            : `<div><label>Margen de utilidad (% sobre el costo)</label><input type="number" id="margen" value="${x.margen}"><div class="mini" id="avMargen"></div></div>`}
        </div>
        <div class="grid g4" style="margin-top:10px">
          <div><label>Precio ajustado (redondeo)</label><input type="number" id="precioAjustado" value="${x.precioAjustado||0}"><div class="mini">0 = usar el calculado</div></div>
          <div><label>Validez (días)</label><input type="number" id="validez" value="${x.validez||15}"></div>
          <div><label>Garantía (meses)</label><input type="number" id="garantia" value="${x.garantia||6}"></div>
          <div><label>Anticipo (%)</label><input type="number" id="anticipo" value="${x.anticipo||50}"></div>
          <div style="grid-column:1/3"><label>Forma de pago</label><input id="formaPago" value="${esc(x.formaPago||'')}"></div>
        </div>
      </div>
      <div style="display:flex;gap:10px"><button class="btn acento" onclick="eliminar('${x.id}')">Eliminar ficha</button>

    </div>

    <div id="panel"></div>
  </div>`;
}
function filasInsumos(x){
  return x.insumos.map((i,k)=>`<tr>
    <td><input data-t="ins" data-k="${k}" data-f="nombre" value="${esc(i.nombre)}"></td>
    <td><input data-t="ins" data-k="${k}" data-f="um" value="${esc(i.um)}" style="width:70px"></td>
    <td><input type="number" data-t="ins" data-k="${k}" data-f="precio" value="${i.precio}" class="num" style="width:95px"></td>
    <td><input type="number" data-t="ins" data-k="${k}" data-f="cantidad" value="${i.cantidad}" class="num" style="width:70px"></td>
    <td class="num imp">${fmt((i.precio||0)*(i.cantidad||0))}</td>
    <td><button class="tachar" onclick="delIns(${k})">×</button></td></tr>`).join('') ||
    `<tr><td colspan="6" class="mini" style="padding:10px">Sin materiales todavía.</td></tr>`;
}
function filasSalarios(x){
  return x.salarios.map((a,k)=>`<tr>
    <td><input data-t="sal" data-k="${k}" data-f="actividad" value="${esc(a.actividad)}"></td>
    <td><input type="number" data-t="sal" data-k="${k}" data-f="trabajadores" value="${a.trabajadores}" class="num" style="width:60px"></td>
    <td><input type="number" data-t="sal" data-k="${k}" data-f="horas" value="${a.horas}" class="num" style="width:60px"></td>
    <td><input type="number" data-t="sal" data-k="${k}" data-f="salarioHora" value="${a.salarioHora}" class="num" style="width:75px"></td>
    <td class="num imp">${fmt((a.horas||0)*(a.salarioHora||0))}</td>
    <td><button class="tachar" onclick="delSal(${k})">×</button></td></tr>`).join('') ||
    `<tr><td colspan="6" class="mini" style="padding:10px">Sin actividades todavía.</td></tr>`;
}
function bindEditor(){
  const x=f();
  const campos=['servicio','cliente','tipo','moneda','um','fecha','combustibles','energia','agua',
    'otrosDirectos','transporte','amortizacion','generales','distribucion','financieros','osde',
    'margen','precioObjetivo','precioAjustado','validez','garantia','anticipo','formaPago'];
  campos.forEach(c=>{const el=document.getElementById(c); if(el) el.oninput=()=>{
    let v=el.value; if(el.type==='number') v=parseFloat(v)||0;
    x[c]=v;
    if(c==='tipo'){ x.margen = (v==='produccion'?DB.rates.margenProduccion:DB.rates.margenServicio); const me=document.getElementById('margen'); if(me) me.value=x.margen; }
    guardar(); pintarPanel();
  };});
  const mp=document.getElementById('modoPrecio'); if(mp) mp.onchange=()=>{ x.modoPrecio=mp.value; guardar(); render(); };
  document.querySelectorAll('[data-t]').forEach(el=>el.oninput=()=>{
    const arr = el.dataset.t==='ins'? x.insumos : x.salarios;
    let v=el.value; if(el.type==='number') v=parseFloat(v)||0;
    const row = arr[el.dataset.k]; row[el.dataset.f]=v;
    const tr = el.closest('tr'), impCell = tr && tr.querySelector('.imp');
    if(impCell){ const imp = el.dataset.t==='ins' ? (row.precio||0)*(row.cantidad||0)
      : (row.horas||0)*(row.salarioHora||0); impCell.textContent = fmt(imp); }
    guardar(); pintarPanel();
  });
  pintarPanel();
}
function refrescarImportes(){ document.getElementById('tInsumos').innerHTML=filasInsumos(f()); document.getElementById('tSalarios').innerHTML=filasSalarios(f()); bindEditor(); }
function addInsumo(){ f().insumos.push({nombre:"",um:"unidad",precio:0,cantidad:1}); guardar(); refrescarImportes(); }
function addSalario(){ f().salarios.push({actividad:"",trabajadores:1,horas:1,salarioHora:0}); guardar(); refrescarImportes(); }
function addDeCatalogo(cid){ if(!cid)return; const c=DB.catalogo.find(c=>c.id===cid); if(c){f().insumos.push({nombre:c.nombre,um:c.um,precio:c.precio,cantidad:1});guardar();refrescarImportes();pintarPanel();} }
function delIns(k){ f().insumos.splice(k,1); guardar(); refrescarImportes(); pintarPanel(); }
function delSal(k){ f().salarios.splice(k,1); guardar(); refrescarImportes(); pintarPanel(); }
function duplicar(i){ const o=DB.fichas.find(x=>x.id===i); const n=JSON.parse(JSON.stringify(o)); n.id=id(); n.servicio=(o.servicio||'')+' (copia)'; DB.fichas.unshift(n); guardar(); edId=n.id; render(); }
function eliminar(i){ if(confirm('¿Eliminar esta ficha?')){ DB.fichas=DB.fichas.filter(x=>x.id!==i); guardar(); edId=null; render(); } }

function pintarPanel(){
  const x=f(), c=calc(x), mon=x.moneda;
  const tope = x.tipo==='produccion'?DB.rates.margenProduccion:DB.rates.margenServicio;
  const supera = c.margenReal>tope+0.01;
  const av=document.getElementById('avMargen');
  if(av){ av.innerHTML = (x.modoPrecio==='fijo')
      ? (supera?`<span style="color:#c0392b">Margen real ${c.margenReal.toFixed(1)}% · ⚠ supera el tope (${tope}%)</span>`:`Margen real: ${c.margenReal.toFixed(1)}% (tope ${tope}%)`)
      : (x.margen>tope?`<span style="color:#c0392b">⚠ Supera el tope legal (${tope}%)</span>`:`Tope legal: ${tope}%`); }
  document.getElementById('panel').innerHTML = `<div class="panel-calc">
    <div style="font-size:13px;color:#aecbe8;margin-bottom:8px">RESUMEN DE LA FICHA</div>
    <div class="row"><span>Materiales (1)</span><span class="v">${fmt(c.fila1,mon)}</span></div>
    <div class="row"><span>Mano de obra (2)</span><span class="v">${fmt(c.fila2,mon)}</span></div>
    <div class="row"><span>Otros directos (3+4)</span><span class="v">${fmt(c.fila3+c.fila4,mon)}</span></div>
    <div class="row"><span><b>Costo total (5)</b></span><span class="v">${fmt(c.fila5,mon)}</span></div>
    <div class="row"><span>Gastos indirectos (6-9)</span><span class="v">${fmt(c.fila6+c.fila7+c.fila8+c.fila9,mon)}</span></div>
    <div class="row"><span>Impuestos (10)</span><span class="v">${fmt(c.fila10,mon)}</span></div>
    <div class="row"><span>Ganancia (${c.margenReal.toFixed(1)}%)</span><span class="v" style="${supera?'color:#ffb4a8':''}">${fmt(c.utilidad,mon)}</span></div>
    <div class="row tot"><span>PRECIO</span><span class="v">${fmt(c.ajustado,mon)}</span></div>
    <div style="margin-top:10px"><small>Te queda neto (tras reserva e impuesto s/ utilidades): <b style="color:#9be8b8">${fmt(c.utilNeta,mon)}</b></small></div>
  </div>`;
}

function imprimirOferta(){
  const x=f(), c=calc(x), mon=x.moneda, e=DB.empresa;
  // En la oferta (ANEXO) se muestran los materiales y el transporte a su importe real;
  // la mano de obra es la diferencia hasta el precio (absorbe amortización, gastos
  // indirectos, impuestos y utilidad), tal como en la oferta original al cliente.
  const insumos=x.insumos.map(i=>`<tr><td>${esc(i.nombre)}</td><td class="num">${esc(i.um)}</td><td class="num">${i.cantidad}</td><td class="num">${fmt(i.precio*i.cantidad,mon)}</td></tr>`).join('');
  const horas = (x.salarios||[]).reduce((s,a)=>s+(a.horas||0),0);
  const manoObra = c.ajustado - c.fila1 - (x.transporte||0);
  imprimir(`<div class="doc">
    <div class="empresa">
      <div><b style="font-size:16px">${esc(e.nombre)}</b><br>${esc(e.direccion)}</div>
      <div style="text-align:right">NIT: ${esc(e.nit)} · Sucursal: ${esc(e.sucursal)}<br>Cuenta MN: ${esc(e.cuenta)}<br>Tel: ${esc(e.telefono)}</div>
    </div>
    <h2>OFERTA: ${esc(x.servicio).toUpperCase()}</h2>

      <tr><th>Equipamiento / elemento</th><th class="num">U/M</th><th class="num">Cant.</th><th class="num">Importe</th></tr>
      ${insumos}

      <tr><td>Mano de obra e instalación</td><td class="num">HR</td><td class="num">${horas||'—'}</td><td class="num">${fmt(manoObra,mon)}</td></tr>

      <b>Garantía:</b> ${x.garantia} meses a partir de la puesta en marcha contra defectos de fabricación.<br>
      <b>Forma de pago:</b> ${esc(x.formaPago)} · <b>Anticipo:</b> ${x.anticipo}%.<br>

    </div>
  </div>`);
}

}
function catAdd(){ DB.catalogo.push({id:id(),nombre:"",um:"unidad",precio:0}); guardar(); render(); }
function catEdit(k,f,v){ DB.catalogo[k][f]=v; guardar(); }

  </div>
  <div class="card">
    <h2>Tasas de impuestos y márgenes</h2><div class="sub">Configuradas con las tasas cubanas actuales (modelo del MFP). Cámbialas solo si tu asesor económico lo indica.</div>
    <div class="grid g4" style="margin-top:10px">
      ${R('r_ventas','Impuesto sobre Ventas',r.ventas)}
      ${R('r_local','Aporte Desarrollo Local',r.local)}
      ${R('r_fuerzaTrabajo','Imp. Fuerza de Trabajo',r.fuerzaTrabajo)}
      ${R('r_segSocial','Contrib. Seg. Social',r.segSocial)}
      ${R('r_segSocialCP','Seg. Social Corto Plazo',r.segSocialCP)}
      ${R('r_vacaciones','Vacaciones',r.vacaciones)}
      ${R('r_utilidades','Impuesto s/ Utilidades',r.utilidades)}
      ${R('r_reserva','Reserva contingencias',r.reserva)}
      ${R('r_margenServicio','Margen máx · Servicios',r.margenServicio)}
      ${R('r_margenProduccion','Margen máx · Producción',r.margenProduccion)}
    </div>
    <div style="margin-top:16px"><button class="btn ok" onclick="guardarEmpresa()">Guardar cambios</button></div>
  </div>`;
}
function guardarEmpresa(){
  const g=id=>document.getElementById(id).value;
  const n=id=>parseFloat(document.getElementById(id).value)||0;
  Object.assign(DB.empresa,{nombre:g('e_nombre'),nit:g('e_nit'),sucursal:g('e_sucursal'),telefono:g('e_telefono'),cuenta:g('e_cuenta'),direccion:g('e_direccion')});
  Object.assign(DB.rates,{ventas:n('r_ventas'),local:n('r_local'),fuerzaTrabajo:n('r_fuerzaTrabajo'),segSocial:n('r_segSocial'),segSocialCP:n('r_segSocialCP'),vacaciones:n('r_vacaciones'),utilidades:n('r_utilidades'),reserva:n('r_reserva'),margenServicio:n('r_margenServicio'),margenProduccion:n('r_margenProduccion')});
  guardar(); alert('Guardado.'); render();
}

/* ========================= VISTA: RESPALDO ========================= */
function vRespaldo(){
  return `<div class="card">
    <h2>Respaldo de datos</h2>
    <div class="sub">Tus datos viven en esta computadora. Exporta de vez en cuando para no perderlos si formateas la PC o quieres pasarlos a otra.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">
      <button class="btn" onclick="exportar()">⬇ Exportar respaldo (.json)</button>
      <label class="btn gris" style="cursor:pointer">⬆ Importar respaldo<input type="file" accept=".json" style="display:none" onchange="importar(event)"></label>
    </div>
    <div class="aviso" style="margin-top:16px">Tienes <b>${DB.fichas.length}</b> fichas y <b>${DB.catalogo.length}</b> materiales en el catálogo.</div>
  </div>`;
}
function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='respaldo-fichas-'+hoy()+'.json'; a.click();
}
function importar(ev){
  const file=ev.target.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ DB=JSON.parse(rd.result); guardar(); alert('Respaldo importado.'); render(); }catch(e){ alert('Archivo inválido.'); } };
  rd.readAsText(file);
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
render();
</script>
